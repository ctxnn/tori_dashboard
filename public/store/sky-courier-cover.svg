<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 900">
  <!-- Sky Courier is a fictional demonstration property (© Kumo Lantern Studio, demo). -->
  <defs>
    <pattern id="tone" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.6" fill="#F3E9D6" opacity=".16"/></pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173029"/><stop offset="1" stop-color="#0E1C18"/></linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#sky)"/>
  <rect width="600" height="900" fill="url(#tone)"/>
  <circle cx="470" cy="170" r="250" fill="#D9472B" opacity=".9"/>
  <svg x="40" y="210" width="520" height="520" viewBox="0 0 800 800">
  <defs>
    <clipPath id="kdisc"><circle cx="400" cy="400" r="372"/></clipPath>
    <pattern id="kwave" width="96" height="48" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#F3E9D6" stroke-width="5">
        <g fill="#1E3A32"><circle cx="0" cy="0" r="46"/><circle cx="96" cy="0" r="46"/></g>
        <circle cx="0" cy="0" r="34"/><circle cx="0" cy="0" r="22"/><circle cx="0" cy="0" r="10"/>
        <circle cx="96" cy="0" r="34"/><circle cx="96" cy="0" r="22"/><circle cx="96" cy="0" r="10"/>
        <g fill="#1E3A32"><circle cx="48" cy="24" r="46"/></g>
        <circle cx="48" cy="24" r="34"/><circle cx="48" cy="24" r="22"/><circle cx="48" cy="24" r="10"/>
        <g fill="#1E3A32"><circle cx="0" cy="48" r="46"/><circle cx="96" cy="48" r="46"/></g>
        <circle cx="0" cy="48" r="34"/><circle cx="0" cy="48" r="22"/><circle cx="0" cy="48" r="10"/>
        <circle cx="96" cy="48" r="34"/><circle cx="96" cy="48" r="22"/><circle cx="96" cy="48" r="10"/>
      </g>
    </pattern>
  </defs>
  <g clip-path="url(#kdisc)">
    <rect width="800" height="800" fill="#F3E9D6"/>
    <circle cx="400" cy="330" r="210" fill="#D9472B"/>
    <rect x="0" y="540" width="800" height="300" fill="url(#kwave)"/>
    <path d="M60 470 C 180 430, 240 520, 360 470 S 560 420, 740 470" fill="none" stroke="#1E3A32" stroke-width="6" stroke-dasharray="2 16" stroke-linecap="round"/>
    <!-- courier bird: folded paper body -->
    <g transform="translate(400 360) rotate(-14)">
      <polygon points="-170,40 150,-70 -20,70" fill="#FBF6EC" stroke="#1E3A32" stroke-width="9" stroke-linejoin="round"/>
      <polygon points="-20,70 150,-70 30,120" fill="#E8DCC4" stroke="#1E3A32" stroke-width="9" stroke-linejoin="round"/>
      <polygon points="-170,40 -20,70 -120,110" fill="#E8DCC4" stroke="#1E3A32" stroke-width="9" stroke-linejoin="round"/>
      <circle cx="150" cy="-70" r="30" fill="#FBF6EC" stroke="#1E3A32" stroke-width="9"/>
      <circle cx="160" cy="-76" r="6" fill="#1E3A32"/>
      <polygon points="178,-70 214,-58 180,-52" fill="#D9472B" stroke="#1E3A32" stroke-width="6" stroke-linejoin="round"/>
      <!-- satchel -->
      <path d="M-40 40 L10 118" stroke="#1E3A32" stroke-width="7"/>
      <rect x="-6" y="108" width="62" height="46" rx="6" fill="#D9472B" stroke="#1E3A32" stroke-width="8"/>
      <path d="M-6 124 L56 124" stroke="#1E3A32" stroke-width="6"/>
    </g>
  </g>
  <circle cx="400" cy="400" r="372" fill="none" stroke="#1E3A32" stroke-width="16"/>
</svg>
  <rect x="0" y="0" width="600" height="118" fill="#F3E9D6"/>
  <text x="34" y="78" font-family="Helvetica Neue, Arial Black, Arial, sans-serif" font-weight="900" font-size="64" letter-spacing="-2" fill="#0E1C18">SKY COURIER</text>
  <text x="566" y="104" text-anchor="end" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-weight="700" font-size="20" fill="#D9472B">スカイ・クーリエ</text>
  <rect x="34" y="770" width="92" height="92" fill="#D9472B"/>
  <text x="80" y="808" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="18" fill="#F3E9D6">VOL.</text>
  <text x="80" y="850" text-anchor="middle" font-family="Helvetica Neue, Arial Black, sans-serif" font-weight="900" font-size="40" fill="#F3E9D6">1</text>
  <text x="566" y="812" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="22" fill="#F3E9D6">AOI KUMOHARA</text>
  <text x="566" y="846" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" fill="#F3E9D6" opacity=".7">KUMO LANTERN STUDIO · DEMO</text>
</svg>
